- question: |
    The quiz host wants you to regret coming to this quiz.
    What is the result of the last expression?

    ```ruby
    class Root
      def greet = "!"
    end

    module Append
      def greet = "World #{super}"
    end

    class Tricky < Root
      def greet = "Hello #{super}"
    end

    Tricky.prepend(Append)
    Tricky.new.greet
    ```
  answers:
    - "Hello !"
    - "World !"
    - "Hello World !"
    - "World Hello !"
    - A NoMethodError is raised
  correct: 3
  time_limit_seconds: 40
  references:
    - https://docs.ruby-lang.org/en/master/Module.html#method-i-prepend
